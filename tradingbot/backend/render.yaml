services:
  - type: web
    name: ai-hub-paper-trading-api
    runtime: python
    plan: free
    rootDir: tradingbot/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: BOT_API_TOKEN
        generateValue: true
      - key: GITHUB_RESEARCH_REPO
        value: haseebop668-a11y/Ai-Hub
      - key: GITHUB_RESEARCH_TOKEN
        sync: false
