name: Publish Signed Paper Trading APK

on:
  push:
    tags:
      - 'txai-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example txai-v0.3.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tradingbot/backend/requirements.txt
      - name: Test backend and research scanner
        working-directory: tradingbot/backend
        run: |
          pip install -r requirements.txt
          pytest -q tests ../research/test_scan.py
      - name: Require configured stable Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tradingbot-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tradingbot-release.jks" >> "$GITHUB_ENV"
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: tradingbot/mobile
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then VERSION="${{ inputs.version }}"; fi
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          gradle --no-daemon --stacktrace assembleRelease -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION"
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          apksigner verify "$APK"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$APK" "$RUNNER_TEMP/release/TX AI-$VERSION.apk"
          sha256sum "$RUNNER_TEMP/release/TX AI-$VERSION.apk" > "$RUNNER_TEMP/release/SHA256SUMS.txt"
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: TX AI ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release/TX AI-*.apk
            ${{ runner.temp }}/release/SHA256SUMS.txt
