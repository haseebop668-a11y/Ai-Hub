name: Grade 9 Offline Android Build

on:
  push:
    branches:
      - main
      - feat/grade9-offline-learning-app
    paths:
      - "apps/grade9_offline/**"
      - ".github/workflows/grade9_android_build.yml"
  pull_request:
    paths:
      - "apps/grade9_offline/**"
      - ".github/workflows/grade9_android_build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grade9-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/grade9_offline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name grade9_offline_learning .

      - name: Set Android compile SDK for plugin requirements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected Android Gradle Kotlin DSL file was not generated")
          source = gradle.read_text()
          old = "compileSdk = flutter.compileSdkVersion"
          if old not in source:
              raise SystemExit("Could not locate generated compileSdk declaration")
          gradle.write_text(source.replace(old, "compileSdk = 36", 1))
          PY

      - name: Align Android library plugins with compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/build.gradle.kts")
          source = gradle.read_text()
          block = """
          subprojects {
              plugins.withId("com.android.library") {
                  afterEvaluate {
                      extensions.findByType<com.android.build.api.dsl.LibraryExtension>()?.compileSdk = 36
                  }
              }
          }
          """
          if 'plugins.withId("com.android.library")' not in source:
              gradle.write_text(source.rstrip() + "\n\n" + block)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Patch cached Android plugin compile SDK declarations
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          package_root = cache / "hosted" / "pub.dev"
          if not package_root.exists():
              raise SystemExit(f"Pub package cache not found: {package_root}")

          patterns = [
              (re.compile(r"(?m)^(\\s*compileSdkVersion\\s+)(?:flutter\\.compileSdkVersion|[0-9]+)"), r"\\g<1>36"),
              (re.compile(r"(?m)^(\\s*compileSdkVersion\\s*=\\s*)(?:flutter\\.compileSdkVersion|[0-9]+)"), r"\\g<1>36"),
              (re.compile(r"(?m)^(\\s*compileSdk\\s+)(?:flutter\\.compileSdkVersion|[0-9]+)"), r"\\g<1>36"),
              (re.compile(r"(?m)^(\\s*compileSdk\\s*=\\s*)(?:flutter\\.compileSdkVersion|[0-9]+)"), r"\\g<1>36"),
          ]
          changed = []
          for gradle in package_root.glob("*/android/build.gradle*"):
              source = gradle.read_text()
              updated = source
              for pattern, replacement in patterns:
                  updated = pattern.sub(replacement, updated)
              if updated != source:
                  gradle.write_text(updated)
                  changed.append(str(gradle))
          picker = list(package_root.glob("file_picker-*/android/build.gradle*"))
          if not picker:
              raise SystemExit("file_picker Android Gradle file was not found in the package cache")
          picker_text = "\\n".join(path.read_text() for path in picker)
          if not any(re.search(r"compileSdk(?:Version)?\\s*(?:=\\s*)?36", picker_text) for _ in [0]):
              raise SystemExit("file_picker compile SDK was not raised to 36")
          print("Patched Android plugin Gradle files:", *changed, sep="\\n")
          PY

      - name: Generate launcher icon
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tooling/generate_launcher_icon.py
          dart run flutter_launcher_icons

      - name: Format Dart sources
        run: dart format .

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grade9-offline-debug-apk
          path: apps/grade9_offline/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
