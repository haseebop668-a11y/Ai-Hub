name: Build Paper Trading Bot

on:
  workflow_dispatch:
  push:
    paths:
      - 'tradingbot/**'
      - '.github/workflows/build-paper-trading-bot.yml'

permissions:
  contents: read

concurrency:
  group: paper-trading-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend automated tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradingbot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tradingbot/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q tests ../research/test_scan.py

  android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate embedded TX AI JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("tradingbot/mobile/app/src/main/assets/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/tx-ai-ui.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/tx-ai-ui.js
      - name: Build APK
        working-directory: tradingbot/mobile
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK archive
        run: |
          test -s tradingbot/mobile/app/build/outputs/apk/debug/app-debug.apk
          unzip -t tradingbot/mobile/app/build/outputs/apk/debug/app-debug.apk
          sha256sum tradingbot/mobile/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: paper-trading-bot-debug-apk
          path: tradingbot/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
