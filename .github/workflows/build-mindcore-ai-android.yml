name: Build MindCore AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mindcore_ai/**'
      - '.github/workflows/build-mindcore-ai-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: flutter create --platforms=android --org com.mindcore --project-name mindcore_ai /tmp/mindcore_host

      - name: Overlay MindCore source and tests
        run: |
          cp mindcore_ai/pubspec.yaml /tmp/mindcore_host/pubspec.yaml
          rm -rf /tmp/mindcore_host/lib /tmp/mindcore_host/test
          cp -R mindcore_ai/lib /tmp/mindcore_host/lib
          cp -R mindcore_ai/test /tmp/mindcore_host/test

      - name: Resolve dependencies
        working-directory: /tmp/mindcore_host
        run: flutter pub get

      - name: Analyze Flutter code (fail on infos and warnings)
        working-directory: /tmp/mindcore_host
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Run widget and responsive smoke tests
        working-directory: /tmp/mindcore_host
        run: flutter test --no-pub --reporter expanded

      - name: Build debug APK
        working-directory: /tmp/mindcore_host
        run: flutter build apk --debug

      - name: Verify APK integrity
        run: |
          APK=/tmp/mindcore_host/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindcore-ai-debug-apk
          path: /tmp/mindcore_host/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
